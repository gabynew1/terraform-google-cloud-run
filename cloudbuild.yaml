steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}', '.']
    id: 'build-image'

  # Step 2: Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}']
    id: 'push-image'

  # Step 3: Run Database Migrations (Optional but Recommended)
  # This uses the Migrator project to update the database schema
  - name: 'mcr.microsoft.com/dotnet/sdk:6.0'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd aspnet-core/src/EC.Migrator
        dotnet run -- --quiet
    env:
      - 'ConnectionStrings__Default=${_DB_CONNECTION_STRING}'
    id: 'run-migrations'
    allowFailure: true # Set to false once connection is verified

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
    id: 'deploy-service'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'

substitutions:
  _REGION: us-central1
  _REPO_NAME: metasign-repo
  _SERVICE_NAME: metasign
  # This should be set in the Cloud Build Trigger or retrieved from Secret Manager
  _DB_CONNECTION_STRING: 'Host=aws-1-eu-west-1.pooler.supabase.com;Port=5432;Database=postgres;Username=postgres.upputswuxbcigublwkby;Password=aQuSyMi8cpXhNLUq;SSL Mode=Require;Trust Server Certificate=true;'

options:
  logging: CLOUD_LOGGING_ONLY
